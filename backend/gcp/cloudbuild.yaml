# Builds both backend images. Called by deploy.sh.
steps:
  - id: api
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/gcp/Dockerfile.api", "-t", "${_API_IMAGE}", "."]
  - id: worker
    name: gcr.io/cloud-builders/docker
    args: ["build", "-f", "backend/gcp/Dockerfile.worker", "--build-arg", "HF_REPO=${_HF_REPO}",
           "-t", "${_WORKER_IMAGE}", "."]
    waitFor: ["-"]
images: ["${_API_IMAGE}", "${_WORKER_IMAGE}"]
substitutions:
  _API_IMAGE: ""
  _WORKER_IMAGE: ""
  _HF_REPO: ""
options:
  machineType: E2_HIGHCPU_8
  diskSizeGb: 100
timeout: 3600s
