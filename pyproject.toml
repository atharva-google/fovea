[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fovea"
version = "0.1.0"
description = "Smart reframing of horizontal videos into vertical, square, or any aspect ratio."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "opencv-python",
    "torch",
    "ultralytics>=8.4.0",
    "lapx",
    "scenedetect",
    "mediapipe",
    "easyocr",
    "python_speech_features",
    "gdown",
    "huggingface_hub",
]

[project.optional-dependencies]
transcribe = ["faster-whisper>=1.1.0", "demucs"]
story = ["faster-whisper>=1.1.0", "demucs", "google-genai"]

[project.scripts]
fovea = "fovea.cli:main"

[tool.setuptools.packages.find]
include = ["fovea*"]
